<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">GeoTwinAI — Nagpur Urban GIS Digital Twin</title><desc id="desc">An editorial map-study graphic for GeoTwinAI. The linework is illustrative and is not a geographic boundary.</desc><defs><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ded9cd" stroke-width="1"/></pattern><pattern id="grid2" width="176" height="176" patternUnits="userSpaceOnUse"><rect width="176" height="176" fill="url(#grid)"/><path d="M176 0H0V176" fill="none" stroke="#cbc5b8" stroke-width="1.25"/></pattern><clipPath id="panel"><rect x="690" y="82" width="430" height="465" rx="8"/></clipPath></defs><rect width="1200" height="630" fill="#f5f2e9"/><path d="M72 71H1128" stroke="#d8d2c6"/><g transform="translate(76 87)"><circle cx="17" cy="17" r="16" fill="#f9f7f0" stroke="#bcc7bb" stroke-width="1.5"/><path d="M8 22 13 14 18 18 25 10" fill="none" stroke="#527c8c" stroke-width="2" stroke-linecap="round"/><circle cx="25" cy="10" r="2.4" fill="#c66a5b"/><text x="47" y="18" fill="#303238" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="-.7">GeoTwin<tspan fill="#527c8c">AI</tspan></text><text x="47" y="34" fill="#7e7c75" font-family="Arial,sans-serif" font-size="8.5" letter-spacing="2">THE LIVING MODEL OF NAGPUR</text></g><text x="78" y="213" fill="#527c8c" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.8">NAGPUR · EVIDENCE-LED URBAN GIS</text><text x="74" y="302" fill="#303238" font-family="Arial,sans-serif" font-size="69" font-weight="600" letter-spacing="-4">See the city</text><text x="74" y="375" fill="#718b7b" font-family="Arial,sans-serif" font-size="69" font-weight="600" letter-spacing="-4">with evidence.</text><text x="78" y="433" fill="#5d5e5a" font-family="Arial,sans-serif" font-size="17">A source-grounded workspace for exploring Nagpur’s</text><text x="78" y="461" fill="#5d5e5a" font-family="Arial,sans-serif" font-size="17">mapped features and transparent planning analysis.</text><rect x="690" y="82" width="430" height="465" rx="8" fill="#eeece2" stroke="#d6d0c3"/><g clip-path="url(#panel)"><rect x="690" y="82" width="430" height="465" fill="url(#grid2)"/><path d="M700 435C770 399 810 413 852 373S928 345 966 300 1038 263 1118 230" fill="none" stroke="#78907d" stroke-width="2" stroke-dasharray="6 8"/><path d="M700 470C770 439 822 445 865 409S941 378 981 337 1049 301 1126 273" fill="none" stroke="#a9b59f" stroke-width="1.5"/><path d="M710 505C786 473 834 480 879 445S954 414 995 377 1062 342 1132 316" fill="none" stroke="#bbc3b4" stroke-width="1.2"/><g fill="#efeee4" stroke="#778076" stroke-width="1.3"><path d="M747 180h57v39h-57z"/><path d="M842 143h48v65h-48z"/><path d="M924 166h68v39h-68z"/><path d="M1018 130h53v44h-53z"/><path d="M793 287h53v42h-53z"/><path d="M916 249h61v43h-61z"/><path d="M1024 346h62v44h-62z"/></g><g fill="#91a58a"><circle cx="822" cy="158" r="7"/><circle cx="1000" cy="241" r="10"/><circle cx="868" cy="332" r="7"/></g><g fill="#c66a5b"><circle cx="952" cy="365" r="5"/><circle cx="1069" cy="215" r="4"/></g><path d="M713 105h21M713 105v21M1097 105h-21M1097 105v21M713 524h21M713 524v-21M1097 524h-21M1097 524v-21" fill="none" stroke="#527c8c" stroke-width="1.6"/><text x="724" y="135" fill="#65736c" font-family="monospace" font-size="9" letter-spacing="1.6">ILLUSTRATIVE MODEL · NOT A MAP</text></g><path d="M72 580H1128" stroke="#d8d2c6"/><text x="77" y="607" fill="#76756c" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">PHYSICAL DIGITAL TWIN · SOURCE-LABELED · NAGPUR</text></svg>
